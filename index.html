<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raiz do Preço</title>
<meta name="description" content="Por que os alimentos estão caros no Brasil — investigue a raiz de cada causa, com dados e fontes oficiais.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23E0610F%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F4;
    --surface:#FFFFFF;
    --surface-2:#F2EEE4;
    --ink:#1B1A16;
    --ink-muted:#6B6A5F;
    --border:#E5E1D6;
    --accent:#E0610F;
    --accent-ink:#FFFFFF;
    --up:#B23A1F;
    --down:#2E7D4F;
    --cat-clima:#2F6F66;
    --cat-economia:#8C6A18;
    --cat-geo:#6B3A54;
    --cat-logistica:#3B5872;
    --cat-tributario:#9A4A2E;
    --radius-card:10px;
    --radius-sm:6px;
    --shadow:0 1px 2px rgba(27,26,22,0.05), 0 3px 14px rgba(27,26,22,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140F;
      --surface:#1E1B15;
      --surface-2:#241F17;
      --ink:#F1ECE1;
      --ink-muted:#A79E8C;
      --border:#332D22;
      --accent:#FF8A42;
      --accent-ink:#17140F;
      --up:#E2775F;
      --down:#6FBF86;
      --cat-clima:#5FB3A4;
      --cat-economia:#D2A94A;
      --cat-geo:#C17EA3;
      --cat-logistica:#7FA3C9;
      --cat-tributario:#E08A63;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140F;
    --surface:#1E1B15;
    --surface-2:#241F17;
    --ink:#F1ECE1;
    --ink-muted:#A79E8C;
    --border:#332D22;
    --accent:#FF8A42;
    --accent-ink:#17140F;
    --up:#E2775F;
    --down:#6FBF86;
    --cat-clima:#5FB3A4;
    --cat-economia:#D2A94A;
    --cat-geo:#C17EA3;
    --cat-logistica:#7FA3C9;
    --cat-tributario:#E08A63;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
    font-size:16.5px;
    line-height:1.6;
  }
  a{color:inherit;}
  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    text-wrap:balance;
    margin:0 0 .35em 0;
    letter-spacing:-.01em;
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  .tabular{font-variant-numeric:tabular-nums;}

  .shell{max-width:1000px;margin:0 auto;padding:22px 22px 90px;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .brand{
    font-family:'Fraunces', Georgia, serif;
    font-weight:700;font-size:1.35rem;
    text-decoration:none;color:var(--ink);
    cursor:pointer;background:none;border:none;padding:0;
  }
  .brand .hi{color:var(--accent);}
  .theme-toggle{
    border:none;background:none;color:var(--ink-muted);
    padding:0;font-size:.76rem;font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;letter-spacing:.08em;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;
  }
  .theme-toggle:hover{color:var(--accent);}

  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:.8rem;
    color:var(--ink-muted);text-decoration:none;background:none;border:none;
    cursor:pointer;padding:0;margin-bottom:24px;
  }
  .back-link:hover{color:var(--accent);}

  /* ---------- hero / intro ---------- */
  .intro{margin-bottom:34px;}
  .intro h1{font-size:2.1rem;font-weight:600;}
  .intro p{color:var(--ink-muted);max-width:58ch;font-size:1.02rem;}
  .intro .kicker{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em;
    font-size:.72rem;color:var(--accent);margin-bottom:12px;display:block;
  }

  /* ---------- section label with short accent underline ---------- */
  .section-label{
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.09em;
    font-size:.76rem;color:var(--ink);font-weight:600;
    margin:34px 0 16px 0;display:inline-block;
    padding-bottom:8px;border-bottom:2px solid var(--accent);
  }

  /* ---------- category label (plain colored text, no pill) ---------- */
  .cat-label{
    font-family:'IBM Plex Mono',monospace;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.08em;white-space:nowrap;font-weight:500;
  }
  .cat-label.clima{color:var(--cat-clima);}
  .cat-label.cambio-economia{color:var(--cat-economia);}
  .cat-label.geopolitica{color:var(--cat-geo);}
  .cat-label.logistica{color:var(--cat-logistica);}
  .cat-label.tributario{color:var(--cat-tributario);}

  /* ---------- price delta (plain colored text, no chip) ---------- */
  .delta{font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:600;}
  .delta.alta{color:var(--up);}
  .delta.baixa{color:var(--down);}

  /* ---------- photo placeholder — blank on purpose, swap in a real <img> later ---------- */
  .photo{background:var(--surface-2);}

  /* ---------- cards & grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{
    display:block;text-decoration:none;color:var(--ink);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
    overflow:hidden;box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--accent);}
  @media (prefers-reduced-motion: reduce){ .card{transition:none;} .card:hover{transform:none;} }

  .prod-card .photo{aspect-ratio:4/3;}
  .prod-card .body{padding:16px;}
  .prod-card .nome{font-size:1.15rem;margin-bottom:6px;}
  .prod-card .preco{font-family:'IBM Plex Mono',monospace;font-size:.92rem;color:var(--ink-muted);margin-bottom:10px;}

  .causa-card{padding:18px;}
  .causa-card .cat-label{display:block;margin-bottom:10px;}
  .causa-card h3{font-size:1.04rem;margin-bottom:6px;}
  .causa-card p{font-size:.87rem;color:var(--ink-muted);margin:0;}
  .causa-card .arrow{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--accent);margin-top:12px;display:inline-block;}

  /* ---------- product detail ---------- */
  .prod-head{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
    overflow:hidden;margin-bottom:30px;box-shadow:var(--shadow);
  }
  .prod-head .photo{aspect-ratio:16/7;}
  .prod-head .body{padding:24px;}
  .prod-head h1{font-size:1.7rem;margin-bottom:2px;}
  .prod-head .unidade-label{color:var(--ink-muted);font-size:.88rem;}
  .price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 0 4px;}
  .price-row .valor{font-family:'IBM Plex Mono',monospace;font-size:1.9rem;font-weight:500;}
  .destaque-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.92rem;color:var(--ink-muted);}
  .destaque-line .delta{font-size:1rem;}

  .fonte-line{
    font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-muted);
    margin-top:5px;
  }
  .fonte-line a{color:var(--ink-muted);text-decoration:underline;text-underline-offset:2px;}
  .fonte-line a:hover{color:var(--accent);}

  details.outras{margin-top:14px;}
  details.outras summary{
    cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.78rem;
    color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:5px;
  }
  details.outras summary::-webkit-details-marker{display:none;}
  details.outras summary::before{content:"+";}
  details.outras[open] summary::before{content:"–";}
  .outras-list{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:10px;}
  .outras-item{font-size:.88rem;}
  .outras-item .periodo{color:var(--ink-muted);}
  .outras-item .valor{font-family:'IBM Plex Mono',monospace;font-weight:500;}

  .nota-box{
    background:var(--surface-2);border-left:3px solid var(--accent);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    padding:12px 16px;margin-top:16px;font-size:.87rem;color:var(--ink-muted);
  }
  .nota-box strong{color:var(--ink);}

  /* ---------- causa / macro detail ---------- */
  .causa-head{margin-bottom:22px;}
  .causa-head .cat-label{display:block;margin-bottom:14px;}
  .causa-head h1{font-size:1.65rem;}
  .prose{font-size:1.03rem;max-width:64ch;color:var(--ink);}
  .prose p{margin:0 0 1em 0;}

  .fontes-block{
    margin-top:24px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-card);padding:18px 20px;box-shadow:var(--shadow);
  }
  .fontes-block .section-label{margin:0 0 10px 0;font-size:.72rem;}
  .fonte-item{
    font-size:.86rem;padding:8px 0;border-bottom:1px dashed var(--border);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .fonte-item:last-child{border-bottom:none;}
  .fonte-item a{text-decoration:underline;text-underline-offset:2px;}
  .fonte-item a:hover{color:var(--accent);}
  .fonte-item .data{font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--ink-muted);white-space:nowrap;}

  .connect-box{
    margin-top:22px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-card);padding:18px 20px;box-shadow:var(--shadow);
  }
  .connect-box .section-label{margin:0 0 10px 0;font-size:.72rem;}
  .connect-list{display:flex;flex-direction:column;}
  .connect-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--ink);
  }
  .connect-item:last-child{border-bottom:none;}
  .connect-item:hover .left{color:var(--accent);}
  .connect-item .left{transition:color .12s ease;}
  @media (prefers-reduced-motion: reduce){ .connect-item .left{transition:none;} }
  .connect-item .prod-tag{
    font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-muted);
  }
  .connect-item .go{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:.9rem;}

  .root-link{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:24px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-card);padding:16px 18px;text-decoration:none;color:var(--ink);
    box-shadow:var(--shadow);
  }
  .root-link:hover{border-color:var(--accent);}
  .root-link:hover .name{color:var(--accent);}
  .root-link .lab{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px;}
  .root-link .name{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;transition:color .12s ease;}
  @media (prefers-reduced-motion: reduce){ .root-link .name{transition:none;} }
  .root-link .go{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:1.2rem;}

  footer{
    margin-top:64px;padding-top:20px;border-top:1px solid var(--border);
    font-size:.78rem;color:var(--ink-muted);
  }

  #app{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ #app{animation:none;} }

  @media (max-width:520px){
    .price-row .valor{font-size:1.6rem;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="brand" onclick="location.hash='#/'">Raiz do <span class="hi">Preço</span></button>
    <button class="theme-toggle" id="themeToggle" type="button">tema</button>
  </div>
  <div id="app"></div>
  <footer>
    Protótipo em construção · dados levantados em agosto de 2026, com fonte e data em cada número · cada causa mostra a fonte usada
  </footer>
</div>

<script>
/* ===================== DATA ===================== */
const CATEGORIAS = {
  'clima': 'Clima',
  'cambio-economia': 'Câmbio e Economia',
  'geopolitica': 'Geopolítica',
  'logistica': 'Logística',
  'tributario': 'Tributário'
};

const PRODUTOS = {
  batata: {
    id:'batata', nome:'Batata',
    preco:{valor:'R$ 2,44', unidade:'por kg (equiv. à saca de 25kg no atacado, SP)', fonte:'CEPEA/ESALQ-USP', url:'https://www.noticiasagricolas.com.br/noticias/hortifruti/426078-batata-cepea-precos-recuam-com-intensificacao-da-safra-e-ritmo-normal-de-colheita.html', data:'7 de agosto de 2026'},
    destaque:{periodo:'acumulado no 1º semestre de 2026', valor:'+100,2%', direcao:'alta', fonte:'CNN Brasil (IBGE/IPCA-15)', url:'https://www.cnnbrasil.com.br/agro/tomate-cenoura-e-batata-acumulam-alta-superior-a-100-em-2026/', data:'25 de junho de 2026'},
    outras:[
      {periodo:'julho de 2026 (mensal)', valor:'-19,59%', fonte:'IBGE — IPCA oficial', url:'https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47739-ipca-fica-em-0-07-em-julho', data:'11 de agosto de 2026'},
      {periodo:'1ª semana de agosto de 2026 (SP)', valor:'-7,5%', fonte:'CEPEA/ESALQ-USP', url:'https://www.noticiasagricolas.com.br/noticias/hortifruti/426078-batata-cepea-precos-recuam-com-intensificacao-da-safra-e-ritmo-normal-de-colheita.html', data:'7 de agosto de 2026'}
    ],
    nota:'O IBGE não publica uma variação oficial "em 12 meses" isolada para a batata. O que dá para afirmar com fonte: alta acumulada de +100% no 1º semestre de 2026, seguida de forte queda em julho e agosto com a entrada da safra de inverno, um padrão de "gangorra" comum nesse produto.',
    causas:['batata-clima','batata-fertilizante','batata-diesel','batata-colheita']
  },
  arroz: {
    id:'arroz', nome:'Arroz',
    preco:{valor:'R$ 76,20', unidade:'por saca de 50kg, em casca — preço ao produtor/indústria, RS', fonte:'CEPEA/Esalq-USP — Indicador do Arroz', url:'https://cepea.org.br/br/indicador/arroz.aspx', data:'20 de agosto de 2026'},
    destaque:{periodo:'1º de julho a 13 de agosto de 2026 (~6 semanas)', valor:'+22%', direcao:'alta', fonte:'Planeta Arroz', url:'https://planetaarroz.com.br/preco-do-arroz-dispara-22-e-chega-a-r-7360-por-saca/', data:'13 de agosto de 2026'},
    outras:[
      {periodo:'12 meses até 19 de julho de 2026', valor:'-6,36% (ainda abaixo do mesmo período do ano anterior)', fonte:'aRede (via Safras & Mercado)', url:'https://arede.info/a-forca-do-agro/662087/el-nino-pode-reduzir-safra-de-arroz-em-202627', data:'19 de julho de 2026'},
      {periodo:'pico das enchentes no RS, 28 mar. a 21 mai. de 2024', valor:'saca foi de R$ 99,13 para R$ 121,57', fonte:'Aos Fatos', url:'https://www.aosfatos.org/noticias/preco-do-arroz-enchentes-rs/', data:'21 de maio de 2024'}
    ],
    nota:'Este é o preço pago ao produtor — não encontramos um preço nacional de varejo em R$/kg com fonte oficial e datada para agosto de 2026. O IBGE também não isolou o item "arroz" nos releases do IPCA de junho e julho que consultamos.',
    causas:['arroz-area-plantada','arroz-el-nino','arroz-retencao','arroz-exportacao']
  },
  feijao: {
    id:'feijao', nome:'Feijão',
    preco:{valor:'R$ 286 a R$ 327', unidade:'por saca de 60kg, carioca tipo 1 (≈ R$ 4,77–5,45/kg)', fonte:'CEPEA/CNA (Esalq-USP)', url:'https://cepea.org.br/br/indicador/feijao.aspx', data:'20 de agosto de 2026'},
    destaque:{periodo:'janeiro a julho de 2026, preço ao consumidor', valor:'+96,8%', direcao:'alta', fonte:'VR (dados de consumo), via CNN Brasil', url:'https://www.cnnbrasil.com.br/agro/preco-do-feijao-carioca-dispara-968-em-2026-aponta-levantamento-da-vr/', data:'16 de agosto de 2026'},
    outras:[
      {periodo:'acumulado até maio de 2026, preço ao produtor', valor:'+85% a +90%', fonte:'Canal Rural (índice CEPEA/CNA)', url:'https://www.canalrural.com.br/economia/quebras-de-safra-sustentam-alta-do-feijao-em-2026-aponta-indice-cepea-cna/', data:'22 de junho de 2026'},
      {periodo:'início de agosto de 2026', valor:'preços em queda com a colheita da 3ª safra', fonte:'Notícias Agrícolas / CEPEA', url:'https://www.noticiasagricolas.com.br/noticias/feijao-e-graos-especiais/426114-feijao-cepea-colheita-pressiona-carioca-neste-inicio-de-agosto.html', data:'10 de agosto de 2026'}
    ],
    nota:'Os números acima vêm de fontes diferentes (preço ao produtor vs. ao consumidor) e não são diretamente comparáveis entre si, mas apontam todos na mesma direção. Em agosto de 2026 os preços já vinham caindo com a nova colheita — a alta forte ficou concentrada no 1º semestre.',
    causas:['feijao-chuva','feijao-area-plantada','feijao-estoques','feijao-produtividade']
  },
  cafe: {
    id:'cafe', nome:'Café',
    preco:{valor:'R$ 25,51', unidade:'pacote de 500g, torrado e moído (média SP) — ≈ R$ 51/kg', fonte:'IBGE, via O Tempo', url:'https://www.otempo.com.br/economia/2026/8/11/preco-do-cafe-acumula-a-maior-queda-da-era-do-plano-real-diz-ibge', data:'referente a junho de 2026'},

    outras:[
      {periodo:'12 meses (mai/2024 a mai/2025)', valor:'+82,24%', fonte:'IBGE/IPCA, via O Tempo', url:'https://www.otempo.com.br/economia/2026/8/11/preco-do-cafe-acumula-a-maior-queda-da-era-do-plano-real-diz-ibge', data:'citado em 11 de agosto de 2026'},
      {periodo:'2023 a 2025, saca de café arábica no mercado físico', valor:'+155%', fonte:'Brasil de Fato (dados Embrapa Café)', url:'https://www.brasildefato.com.br/2025/01/23/producao-em-queda-e-exportacao-em-alta-o-que-explica-a-alta-do-cafe/', data:'21 de janeiro de 2025'}
    ],
    nota:'O café fez um ciclo: disparada forte entre 2023 e 2025 (quebra de safra + câmbio + exportação recorde) e queda acentuada ao longo de 2026 com a recuperação da safra brasileira — mas o preço de junho de 2026 ainda estava acima do início de 2025.',
    causas:['cafe-seca-brasil','cafe-vietna','cafe-cambio','cafe-tarifa-eua','cafe-portos']
  },
  carne: {
    id:'carne', nome:'Carne bovina',
    preco:{valor:'R$ 345,70', unidade:'por arroba (15kg) de boi gordo, indicador São Paulo', fonte:'CEPEA/ESALQ-USP', url:'https://cepea.org.br/br/indicador/boi-gordo.aspx', data:'20 de agosto de 2026'},
    destaque:{periodo:'12 meses até maio de 2026, carne bovina (IPCA)', valor:'+9,8%', direcao:'alta', fonte:'IBGE/IPCA, via O Especialista (Safra)', url:'https://oespecialista.safra.com.br/analise/inflacao-alimentos-carne-cerveja-ipca/', data:'15 de junho de 2026'},
    outras:[
      {periodo:'recorde histórico da série desde 1997', valor:'R$ 365,45/arroba em 9 de abril de 2026', fonte:'CEPEA/ESALQ-USP, via Canal Rural', url:'https://www.canalrural.com.br/pecuaria/preco-do-boi-gordo-atinge-maior-valor-da-serie-historica-desde-1997-diz-cepea/', data:'9 de abril de 2026'},

/* ===================== HELPERS ===================== */
function esc(s){
  const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML;
}
function catLabelHtml(cat){
  return '<span class="cat-label '+cat+'">'+esc(CATEGORIAS[cat]||cat)+'</span>';
}
/* Placeholder photo — empty on purpose. Swap for a real <img src="data:..."> once a photo exists */
function photoHtml(extraClass){
  return '<div class="photo'+(extraClass?' '+extraClass:'')+'"></div>';
}
function fontesHtml(fontes){
  return '<div class="fontes-block"><p class="section-label">Fontes</p>' +
    fontes.map(f=>'<div class="fonte-item"><a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.titulo)+'</a><span class="data mono">'+esc(f.data)+'</span></div>').join('') +
    '</div>';
}
function causasQueApontamPara(macroId){
  return Object.keys(CAUSAS).filter(k => CAUSAS[k].macro === macroId);
}

/* ===================== VIEWS ===================== */
function viewHome(){
  const cards = Object.values(PRODUTOS).map(p => {
    const d = p.destaque;
    return '<a class="card prod-card" href="#/produto/'+p.id+'">' +
      photoHtml() +
      '<div class="body">' +
        '<div class="nome">'+esc(p.nome)+'</div>' +
        '<div class="preco tabular">'+esc(p.preco.valor)+'</div>' +
        '<span class="delta '+d.direcao+' tabular">'+(d.direcao==='alta'?'▲':'▼')+' '+esc(d.valor)+'</span>' +
      '</div>' +
      '</a>';
  }).join('');

  return '<div class="intro">' +
    '<span class="kicker">Investigação de preços · Brasil, 2026</span>' +
    '<h1>Por que a comida está cara?</h1>' +
    '<p>Não é só um vilão. Escolha um alimento, veja o que aconteceu com o preço dele e clique em cada causa para investigar até a raiz, com fonte oficial e data em cada número que aparece aqui.</p>' +
    '</div>' +
    '<p class="section-label">Alimentos</p>' +
    '<div class="grid">'+cards+'</div>';
}

function viewProduto(id){
  const p = PRODUTOS[id];
  if(!p) return viewNotFound();
  const outrasHtml = (p.outras&&p.outras.length) ? (
    '<details class="outras"><summary>ver outras variações registradas</summary>' +
    '<div class="outras-list">' +
    p.outras.map(o=>'<div class="outras-item"><span class="periodo">'+esc(o.periodo)+':</span> <span class="valor tabular">'+esc(o.valor)+'</span>' +
      '<div class="fonte-line">fonte: <a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.fonte)+'</a> · '+esc(o.data)+'</div></div>').join('') +
    '</div></details>'
  ) : '';
  const notaHtml = p.nota ? '<div class="nota-box"><strong>Transparência sobre os dados:</strong> '+esc(p.nota)+'</div>' : '';

  const causasHtml = p.causas.map(cid => {
    const c = CAUSAS[cid];
    return '<a class="card causa-card" href="#/causa/'+cid+'">' +
      catLabelHtml(c.categoria) +
      '<h3>'+esc(c.titulo)+'</h3>' +
      '<p>'+esc(c.resumo.slice(0,120))+'…</p>' +
      '<span class="arrow">investigar →</span>' +
      '</a>';
  }).join('');

  return '<button class="back-link" onclick="location.hash=\'#/\'">← todos os alimentos</button>' +
    '<div class="prod-head">' +
      photoHtml() +
      '<div class="body">' +
        '<h1>'+esc(p.nome)+'</h1><div class="unidade-label">'+esc(p.preco.unidade)+'</div>' +
        '<div class="price-row"><span class="valor tabular">'+esc(p.preco.valor)+'</span></div>' +
        '<div class="fonte-line">fonte: <a href="'+esc(p.preco.url)+'" target="_blank" rel="noopener">'+esc(p.preco.fonte)+'</a> · '+esc(p.preco.data)+'</div>' +
        '<div class="destaque-line"><span class="delta '+p.destaque.direcao+' tabular">'+(p.destaque.direcao==='alta'?'▲':'▼')+' '+esc(p.destaque.valor)+'</span> '+esc(p.destaque.periodo)+'</div>' +
        '<div class="fonte-line">fonte: <a href="'+esc(p.destaque.url)+'" target="_blank" rel="noopener">'+esc(p.destaque.fonte)+'</a> · '+esc(p.destaque.data)+'</div>' +
        outrasHtml + notaHtml +
      '</div>' +
    '</div>' +
    '<p class="section-label">O que está por trás desse preço</p>' +
    '<div class="grid">'+causasHtml+'</div>';
}

function viewCausa(id){
  const c = CAUSAS[id];
  if(!c) return viewNotFound();

  const backTarget = c.produtoPai ? ('#/produto/'+c.produtoPai) : '#/';
  const backLabel = c.produtoPai ? ('← voltar para '+PRODUTOS[c.produtoPai].nome) : '← voltar ao início';

  let rootHtml = '';
  if(c.macro && CAUSAS[c.macro]){
    const m = CAUSAS[c.macro];
    rootHtml = '<a class="root-link" href="#/causa/'+c.macro+'">' +
      '<div><span class="lab">ir até a raiz</span><span class="name">'+esc(m.titulo)+'</span></div>' +
      '<span class="go">→</span></a>';
  }

  let verTambemHtml = '';
  if(c.ver_tambem_produtos && c.ver_tambem_produtos.length){
    verTambemHtml = '<div class="connect-box"><p class="section-label">Esse mesmo fator também aparece em</p><div class="connect-list">' +
      c.ver_tambem_produtos.map(pid=>{
        const pp = PRODUTOS[pid];
        return '<a class="connect-item" href="#/produto/'+pid+'"><span class="left">'+esc(pp.nome)+'</span><span class="go">→</span></a>';
      }).join('') + '</div></div>';
  }

  let conectadosHtml = '';
  if(c.isMacro){
    const ligados = causasQueApontamPara(id);
    if(ligados.length){
      conectadosHtml = '<div class="connect-box"><p class="section-label">Produtos afetados por esta mesma raiz</p><div class="connect-list">' +
        ligados.map(lid=>{
          const l = CAUSAS[lid];
          const pp = PRODUTOS[l.produtoPai];
          return '<a class="connect-item" href="#/causa/'+lid+'"><span class="left">'+esc(l.titulo)+' <span class="prod-tag">'+esc(pp.nome)+'</span></span><span class="go">→</span></a>';
        }).join('') + '</div></div>';
    }
  }

  return '<button class="back-link" onclick="location.hash=\''+backTarget+'\'">'+backLabel+'</button>' +
    '<div class="causa-head">' + catLabelHtml(c.categoria) + '<h1>'+esc(c.titulo)+'</h1></div>' +
    '<div class="prose"><p>'+esc(c.resumo)+'</p></div>' +
    fontesHtml(c.fontes) +
    rootHtml + verTambemHtml + conectadosHtml;
}

function viewNotFound(){
  return '<div class="intro"><h1>Não achamos essa página</h1><p>Volte para o início e escolha um alimento.</p></div>' +
    '<button class="back-link" onclick="location.hash=\'#/\'">← início</button>';
}

/* ===================== ROUTER ===================== */
function render(){
  const app = document.getElementById('app');
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  let html;
  if(parts.length===0){ html = viewHome(); }
  else if(parts[0]==='produto' && parts[1]){ html = viewProduto(parts[1]); }
  else if(parts[0]==='causa' && parts[1]){ html = viewCausa(parts[1]); }
  else { html = viewNotFound(); }

  app.style.animation='none'; app.offsetHeight; app.style.animation='';
  app.innerHTML = html;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();

/* ===================== THEME TOGGLE ===================== */
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const saved = (function(){ try{ return localStorage.getItem('raiz-tema'); }catch(e){ return null; } })();
  if(saved) root.setAttribute('data-theme', saved);
  btn.addEventListener('click', function(){
    const current = root.getAttribute('data-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const effectiveIsDark = current ? current==='dark' : prefersDark;
    const next = effectiveIsDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('raiz-tema', next); }catch(e){}
  });
})();
</script>
